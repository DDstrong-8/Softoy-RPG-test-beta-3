<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">

<title>Softoy RPG — Beta Test 4</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101827;
    font-family:Arial,sans-serif;
}

button{
    font:inherit;
    cursor:pointer;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #263b5b 0%,
            #17243a 45%,
            #0b1220 100%
        );

    color:white;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:12px;
    text-shadow:0 5px 15px #000;
}

.subtitle{
    opacity:.75;
    margin-bottom:45px;
}

.startButton{
    width:260px;
    padding:18px;
    margin:8px;

    border:0;
    border-radius:16px;

    background:#ffffff;
    color:#162033;

    font-size:20px;
    font-weight:bold;

    box-shadow:0 8px 20px #0008;
}

.startButton:active{
    transform:scale(.97);
}

/* =========================================================
   GAME
========================================================= */

#game{
    display:none;

    position:fixed;
    inset:0;

    overflow:hidden;

    background:#87b95d;
}

#camera{
    position:absolute;
    inset:0;
    overflow:hidden;
}

#world{
    position:absolute;

    left:0;
    top:0;

    width:5000px;
    height:3600px;

    transform-origin:0 0;

    background:#8fbd63;
}

/* =========================================================
   GROUND
========================================================= */

.ground{
    position:absolute;

    border-radius:
        45% 55% 50% 40% /
        55% 40% 60% 45%;

    background:#7fb257;
}

.ground.dark{
    background:#6da04c;
}

.ground.light{
    background:#9bc96b;
}

/* =========================================================
   CLIFFS
========================================================= */

.cliff{
    position:absolute;

    background:
        linear-gradient(
            #65744d,
            #566440
        );

    border:8px solid #48563a;

    box-shadow:
        0 12px 0 #3d4931,
        inset 0 8px 0 #78865d;

    z-index:5;
}

.cliff::after{
    content:"";

    position:absolute;

    inset:8px;

    border:3px dashed #89966c;

    opacity:.45;
}

/* =========================================================
   PATHS
========================================================= */

.path{
    position:absolute;

    background:#c9a875;

    border-radius:50px;

    box-shadow:
        inset 0 5px 0 #d7ba8b;
}

/* =========================================================
   WATER
========================================================= */

.water{
    position:absolute;

    background:#55a9d8;

    border:7px solid #3888b6;

    border-radius:
        48% 52% 45% 55% /
        50% 45% 55% 50%;

    overflow:hidden;
}

.water::after{
    content:"";

    position:absolute;

    inset:15px;

    border-top:4px solid #8bd2ee;

    border-radius:50%;

    opacity:.5;
}

/* =========================================================
   BRIDGE
========================================================= */

.bridge{
    position:absolute;

    background:#9a653b;

    border:7px solid #6d4328;

    z-index:12;
}

.bridge::before{
    content:"";

    position:absolute;

    inset:12px 0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 30px,
            #5e3925 30px 36px
        );
}

/* =========================================================
   DECORATIONS
========================================================= */

.tree{
    position:absolute;

    width:70px;
    height:95px;

    z-index:20;
}

.tree .trunk{
    position:absolute;

    bottom:0;
    left:27px;

    width:17px;
    height:45px;

    background:#76502f;

    border-radius:7px;
}

.tree .crown{
    position:absolute;

    width:65px;
    height:65px;

    top:0;
    left:2px;

    border-radius:50%;

    background:#387842;

    box-shadow:
        20px -10px 0 #43884b,
        -18px 7px 0 #316b3a,
        10px 18px 0 #4b934f;
}

.tree.small{
    transform:scale(.75);
}

.bush{
    position:absolute;

    width:62px;
    height:42px;

    border-radius:50%;

    background:#3e873f;

    z-index:18;

    box-shadow:
        15px -5px 0 #4b9446,
        -15px 4px 0 #327336;
}

.berry{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#e84b77;

    z-index:22;
}

.rock{
    position:absolute;

    width:48px;
    height:35px;

    background:#777c78;

    border-radius:
        45% 55% 40% 60%;

    z-index:18;

    box-shadow:
        inset 8px 5px 0 #989d98;
}

.flower{
    position:absolute;

    font-size:22px;

    z-index:18;
}

/* =========================================================
   AREA LABELS
========================================================= */

.areaLabel{
    position:absolute;

    color:#fff;

    font-size:28px;
    font-weight:900;

    text-shadow:0 3px 8px #0009;

    z-index:50;
}

/* =========================================================
   ENTRANCES
========================================================= */

.entrance{
    position:absolute;

    z-index:60;

    padding:12px 18px;

    border-radius:14px;

    background:#1c2637dd;

    color:white;

    font-weight:bold;

    border:2px solid #ffffff66;
}

/* =========================================================
   PLAYER
========================================================= */

#player{
    position:absolute;

    width:52px;
    height:52px;

    z-index:100;

    transform:
        translate(-50%,-50%);

    display:block;
    visibility:visible;
}

.hechieBody{
    width:44px;
    height:44px;

    position:absolute;

    left:4px;
    top:4px;

    border-radius:50%;

    background:#d7a75c;

    border:4px solid #805e32;

    box-shadow:
        0 4px 0 #604722;
}

.hechieBody::before{
    content:"";

    position:absolute;

    width:9px;
    height:9px;

    background:#171717;

    border-radius:50%;

    left:9px;
    top:10px;

    box-shadow:
        17px 0 0 #171717;
}

.weapon{
    position:absolute;

    width:65px;
    height:8px;

    background:#c9ced1;

    border-radius:3px;

    right:-39px;
    top:19px;

    transform:rotate(-25deg);

    transform-origin:left center;

    z-index:3;
}

.weapon::after{
    content:"";

    position:absolute;

    right:-18px;
    top:-9px;

    width:30px;
    height:26px;

    background:#c9ced1;

    clip-path:
        polygon(
            0 25%,
            100% 0,
            72% 100%,
            0 75%
        );
}

.weapon::before{
    content:"";

    position:absolute;

    left:5px;
    top:-8px;

    width:7px;
    height:24px;

    background:#9b48c9;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );

    box-shadow:
        15px 0 #9b48c9,
        30px 0 #9b48c9;
}

/* =========================================================
   ENEMIES
========================================================= */

.enemy{
    position:absolute;

    width:50px;
    height:50px;

    z-index:90;

    transform:
        translate(-50%,-50%);
}

.enemyBody{
    position:absolute;

    inset:6px;

    border-radius:45%;

    border:3px solid #26351d;
}

.enemy.grassling .enemyBody{
    background:#68b94e;
}

.enemy.rat .enemyBody{
    background:#77706a;
}

.enemy.pidgeoning .enemyBody{
    background:#bcbcbc;

    border-radius:
        50% 50% 40% 40%;
}

.enemy.minion .enemyBody{
    background:#a95d45;

    border-color:#512e24;
}

.enemy.armored .enemyBody{
    background:#6d737a;

    border-color:#30353a;
}

.enemy.grudger .enemyBody{
    background:#23552b;

    border-color:#17371c;
}

.enemy.mimic .enemyBody{
    background:#a46b35;

    border-radius:8px;
}

.enemyLabel{
    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    top:-27px;

    white-space:nowrap;

    font-size:11px;

    font-weight:bold;

    color:white;

    background:#182033dd;

    padding:3px 6px;

    border-radius:5px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;

    left:14px;
    top:14px;

    z-index:500;

    width:260px;

    color:white;
}

.playerCard{
    padding:12px;

    border-radius:14px;

    background:#111827dd;

    border:1px solid #ffffff22;

    box-shadow:
        0 5px 18px #0006;
}

.statTitle{
    font-weight:bold;

    margin-bottom:5px;
}

.bar{
    height:13px;

    border-radius:20px;

    background:#252d3c;

    overflow:hidden;

    margin-bottom:7px;
}

.barFill{
    height:100%;

    width:100%;

    transition:
        width .25s;
}

.hpFill{
    background:#e85b61;
}

.energyFill{
    background:#55aeea;
}

.expFill{
    background:#d9b84c;
}

.smallText{
    font-size:12px;

    opacity:.85;
}

/* =========================================================
   MENU
========================================================= */

#menuButton{
    position:fixed;

    right:15px;
    top:15px;

    z-index:600;

    width:52px;
    height:52px;

    border:0;

    border-radius:15px;

    background:#111827dd;

    color:white;

    font-size:24px;
}

#menu{
    display:none;

    position:fixed;

    right:15px;
    top:78px;

    width:250px;

    padding:15px;

    background:#111827f5;

    border:1px solid #ffffff22;

    border-radius:16px;

    color:white;

    z-index:700;
}

.menuButton{
    width:100%;

    padding:12px;

    margin:5px 0;

    border:0;

    border-radius:10px;

    background:#263247;

    color:white;

    font-weight:bold;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    position:fixed;

    bottom:25px;
    left:25px;

    width:145px;
    height:145px;

    border-radius:50%;

    background:#11182766;

    border:3px solid #ffffff55;

    z-index:600;

    touch-action:none;
}

#stick{
    position:absolute;

    width:65px;
    height:65px;

    border-radius:50%;

    left:40px;
    top:40px;

    background:#ffffffaa;

    border:3px solid #ffffffcc;
}

/* =========================================================
   BATTLE
========================================================= */

#battle{
    display:none;

    position:fixed;

    inset:0;

    z-index:900;

    background:
        radial-gradient(
            circle at 50% 25%,
            #526f52,
            #253c2c 60%,
            #101820
        );

    color:white;
}

#battleGround{
    position:absolute;

    inset:0;

    overflow:hidden;
}

.battlePlatform{
    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    bottom:25%;

    width:80%;
    height:20%;

    border-radius:50%;

    background:#567448;

    border:8px solid #34492d;
}

.battleEnemy{
    position:absolute;

    left:68%;
    top:35%;

    transform:
        translate(-50%,-50%);

    width:95px;
    height:95px;
}

.battleEnemy .enemyBody{
    inset:0;
}

#battlePlayer{
    position:absolute;

    left:25%;

    bottom:29%;

    width:100px;
    height:100px;

    transform:
        translate(-50%,-50%)
        scale(1.5);
}

#battleInfo{
    position:absolute;

    top:18px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(600px,90%);

    background:#101827dd;

    padding:12px;

    border-radius:14px;

    text-align:center;
}

#battleMessage{
    min-height:45px;

    font-weight:bold;
}

#targetPanel{
    position:absolute;

    top:115px;
    right:20px;

    width:210px;
}

.targetButton{
    width:100%;

    margin:4px;

    padding:9px;

    border:2px solid transparent;

    border-radius:9px;

    background:#182234dd;

    color:white;
}

.targetButton.selected{
    border-color:#f5d85b;
}

#battleActions{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(700px,95%);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.attackButton{
    min-height:55px;

    border:0;

    border-radius:12px;

    background:#27354c;

    color:white;

    font-weight:bold;
}

.attackButton:active{
    transform:scale(.97);
}

.attackButton:disabled{
    opacity:.35;
}

/* =========================================================
   BATTLE END
========================================================= */

#battleEnd{
    display:none;

    position:absolute;

    inset:0;

    background:#07101dcc;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    z-index:20;
}

.endCard{
    width:min(400px,90%);

    background:#182236;

    border-radius:18px;

    padding:25px;

    text-align:center;
}

.endButton{
    margin-top:15px;

    width:100%;

    padding:14px;

    border:0;

    border-radius:12px;

    background:white;

    color:#172033;

    font-weight:bold;
}

/* =========================================================
   FLOATING DAMAGE
========================================================= */

.floatText{
    position:absolute;

    z-index:999;

    color:#fff;

    font-size:22px;

    font-weight:900;

    text-shadow:
        0 3px 5px #000;

    pointer-events:none;

    animation:
        floatUp .8s forwards;
}

@keyframes floatUp{

    from{
        opacity:1;

        transform:
            translate(-50%,0);
    }

    to{
        opacity:0;

        transform:
            translate(-50%,-65px);
    }
}

/* =========================================================
   LEVEL POPUP
========================================================= */

#levelPopup{
    display:none;

    position:fixed;

    inset:0;

    z-index:950;

    align-items:center;

    justify-content:center;

    pointer-events:none;
}

.levelCard{
    padding:25px 40px;

    border-radius:20px;

    background:#151f31ee;

    color:white;

    text-align:center;

    border:2px solid #e4c94c;

    box-shadow:
        0 0 30px #e4c94c55;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .logo{
        font-size:38px;
    }

    #hud{
        width:210px;

        transform:scale(.9);

        transform-origin:
            top left;
    }

    #battleActions{
        grid-template-columns:
            repeat(2,1fr);
    }

    #targetPanel{
        top:100px;

        right:10px;

        width:165px;
    }
}

</style>
</head>

<body>

     START SCREEN
========================================================= -->

        SOFTOY RPG
    </div>

    <div class="subtitle">

    <!-- =================================================

const SAVE_KEY =

function saveGame(){

    const data={

        version:4,

        player:{
            x:game.player.x,
            y:game.player.y
        },

        hechie:{
            level:game.hechie.level,
            hp:game.hechie.hp,
            maxHp:game.hechie.maxHp,

            energy:game.hechie.energy,
            maxEnergy:game.hechie.maxEnergy,

            attack:game.hechie.attack,
            defense:game.hechie.defense,

            exp:game.hechie.exp,
            nextExp:game.hechie.nextExp
        },

        enemies:
            game.enemies.map(
                enemy=>({

                    id:enemy.id,

                    type:enemy.type,

                    level:enemy.level,

                    x:enemy.x,
                    y:enemy.y,

                    hp:enemy.hp,
                    maxHp:enemy.maxHp,

                    alive:enemy.alive,

                    poisoned:
                        !!enemy.poisoned

                })
            )

    };

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(data)
    );

    const status =
        document.getElementById(
            "saveStatus"
        );

    if(status){

        status.textContent =
            "Game saved.";
    }
}


function loadGame(){

    const raw =
        localStorage.getItem(
            SAVE_KEY
        );

    if(!raw){

        return false;
    }

    try{

        const data =
            JSON.parse(raw);


        if(
            !data.player ||
            !data.hechie
        ){

            return false;
        }


        game.player.x =
            data.player.x;

        game.player.y =
            data.player.y;


        Object.assign(
            game.hechie,
            data.hechie
        );


        game.enemies=[];

        if(
            Array.isArray(
                data.enemies
            )
        ){

            data.enemies.forEach(
                saved=>{

                    const database =
                        enemyTypes[
                            saved.type
                        ];

                    if(!database){

                        return;
                    }


                    game.enemies.push({

                        id:saved.id,

                        type:saved.type,

                        level:saved.level,

                        x:saved.x,
                        y:saved.y,

                        hp:saved.hp,

                        maxHp:
                            saved.maxHp,

                        attack:
                            getEnemyStats(
                                saved.type,
                                saved.level
                            ).attack,

                        defense:
                            getEnemyStats(
                                saved.type,
                                saved.level
                            ).defense,

                        speed:
                            getEnemyStats(
                                saved.type,
                                saved.level
                            ).speed,

                        xp:
                            getEnemyStats(
                                saved.type,
                                saved.level
                            ).xp,

                        alive:
                            saved.alive,

                        poisoned:
                            !!saved.poisoned,

                        moving:false,

                        vx:0,
                        vy:0,

                        moveTimer:
                            Math.random()*100

                    });

                }
            );

        }


        game.enemyId=0;

        game.enemies.forEach(
            enemy=>{

                if(
                    enemy.id>
                    game.enemyId
                ){

                    game.enemyId =
                        enemy.id;
                }

            }
        );


        return true;

    }catch(error){

        console.error(
            "Save loading error:",
            error
        );

        return false;
    }
}

/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    return Math.sqrt(

        Math.pow(
            a.x-b.x,
            2
        )+

        Math.pow(
            a.y-b.y,
            2
        )

    );
}


/* =========================================================
   SPAWN BUFFER
========================================================= */

function isInSpawnBuffer(
    x,
    y
){

    const buffer=280;


    return(

        x >=
        game.cameraX-buffer &&

        x <=
        game.cameraX+
        window.innerWidth+
        buffer &&

        y >=
        game.cameraY-buffer &&

        y <=
        game.cameraY+
        window.innerHeight+
        buffer

    );

}


/* =========================================================
   VALID ENEMY POSITION
========================================================= */

function validEnemyPosition(
    x,
    y
){

    if(
        x<100 ||
        y<100
    ){

        return false;
    }


    if(
        x>
        game.worldWidth-100 ||

        y>
        game.worldHeight-100
    ){

        return false;
    }


    if(
        distance(
            {
                x:x,
                y:y
            },
            game.player
        )<380
    ){

        return false;
    }


    if(
        isInSpawnBuffer(
            x,
            y
        )
    ){

        return false;
    }


    return true;
}

    if(roll<.94)

    if(roll<.985)

    return "mimicChest";
}

   SPAWN ENEMY

            (
                game.worldWidth-300
            )+

        y =

            (
                game.worldHeight-300
            )+

        attempts++;

    }while(

        !validEnemyPosition(
            x,
            y
        )&&

        attempts<100

    );


    if(
        attempts>=100
    ){

        return;
    }


    const type =
        chooseEnemyType();


    const level =
        Math.max(

            1,

            Math.min(

                20,

                Math.floor(

                )

            )

        );

            level
        );

        level:level,

        hp:stats.hp,

        maxHp:stats.hp,

        attack:stats.attack,

        defense:stats.defense,

        speed:stats.speed,

        xp:stats.xp,

        alive:true,

        poisoned:false,

        moving:false,

        vy:0,

/* =========================================================
   ENEMY MOVEMENT
========================================================= */

function updateEnemyMovement(){

    game.enemies.forEach(
        enemy=>{

            if(
                !enemy.alive
            ){

                return;
            }


            enemy.moveTimer--;


            if(
                enemy.moveTimer<=0
            ){

                enemy.moveTimer =
                    80+
                    Math.random()*180;


                const angle =
                    Math.random()*
                    Math.PI*2;


                enemy.vx =
                    Math.cos(angle)*.35;

                enemy.vy =
                    Math.sin(angle)*.35;

            }


            const oldX =
                enemy.x;

            const oldY =
                enemy.y;


            enemy.x +=
                enemy.vx;

            enemy.y +=
                enemy.vy;


            if(

                enemy.x<100 ||

                enemy.x>
                game.worldWidth-100

            ){

                enemy.x=oldX;

                enemy.vx*=-1;

            }


            if(

                enemy.y<100 ||

                enemy.y>
                game.worldHeight-100

            ){

                enemy.y=oldY;

                enemy.vy*=-1;

            }


            if(
                distance(
                    enemy,
                    game.player
                )<250
            ){

                enemy.x=oldX;
                enemy.y=oldY;

                const angle =
                    Math.atan2(

                        enemy.y-
                        game.player.y,

                        enemy.x-
                        game.player.x

                    );


                enemy.vx =
                    Math.cos(angle)*
                    .5;

                enemy.vy =
                    Math.sin(angle)*
                    .5;

            }


            updateEnemyVisual(
                enemy
            );

        }
    );

}

        game.player.x-

    game.cameraY =

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


function joystickMove(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;


    const centerY =
        rect.top+
        rect.height/2;


    let dx =
        clientX-centerX;


    let dy =
        clientY-centerY;


    const max=40;


    const length =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(
        length>max
    ){

        dx =
            dx/length*
            max;

        dy =
            dy/length*
            max;

    }


    stick.style.left =
        (
            40+dx
        )+
        "px";


    stick.style.top =
        (
            40+dy
        )+
        "px";


    game.joystick.dx =
        dx/max;

    game.joystick.dy =
        dy/max;

}


joystick.addEventListener(
    "pointerdown",
    e=>{

        game.joystick.active =
            true;


        joystick.setPointerCapture(
            e.pointerId
        );


        joystickMove(
            e.clientX,
            e.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",

/* =========================================================
   LEVEL SYSTEM
========================================================= */

function gainEXP(
    amount
){

    const h =
        game.hechie;


    h.exp +=
        amount;


    while(

        h.exp>=h.nextExp &&

        h.level<99

    ){

        h.exp -=
            h.nextExp;


        h.level++;


        h.nextExp =
            Math.floor(

                100+

                h.level*h.level*2.2+

                h.level*35

            );


        h.maxHp +=
            h.level<=30
            ?
            7
            :
            5;


        h.hp =
            h.maxHp;


        h.maxEnergy +=
            h.level<=30
            ?
            10
            :
            6;


        h.energy =
            h.maxEnergy;


        h.attack +=
            h.level<=30
            ?
            3
            :
            2;


        h.defense +=
            h.level<=30
            ?
            2
            :
            1;


        showLevelUp();

    }


    updateHUD();

}

/* =========================================================
   DAMAGE SYSTEM
========================================================= */

/*
   Damage calculation:

   1. Start with Attack.
   2. Multiply by damage multiplier.
   3. Subtract Defense.
   4. Minimum damage is 1.
   5. Round to a whole number.

   Example:

   Attack 20
   Multiplier 1.5

   20 × 1.5 = 30

   Defense 8

   30 - 8 = 22

   Final damage = 22
*/

function calculateDamage(
    attackerAttack,
    multiplier,
    defenderDefense
){

    let damage =
        attackerAttack*
        multiplier;


    damage -=
        defenderDefense;


    damage =
        Math.max(
            1,
            damage
        );


    return Math.round(
        damage
    );

}


/* =========================================================
   DAMAGE TYPES
========================================================= */

const damageChart={

    Normal:{

    },

    Fire:{

        Wood:2

    },

    Wood:{

        Fire:.5,

        Water:2

    },

    Water:{

        Wood:.5,

        Poison:2,

        Electric:2,

        Fire:2

    },

    Poison:{

        Wood:.5,

        Water:.5

    },

    Electric:{

        Water:2

    },

    Metal:{

    }

};


/* =========================================================
   TYPE MULTIPLIER
========================================================= */

function getTypeMultiplier(
    attackType,
    defenderType
){

    if(

        damageChart[
            attackType
        ] &&

        damageChart[
            attackType
        ][
            defenderType
        ]

    ){

        return damageChart[
            attackType
        ][
            defenderType
        ];

    }


    /*
       Every unlisted matchup
       remains 1×.
    */

    return 1;

}

/* =========================================================
   BATTLE START
========================================================= */

function startBattle(
    triggerEnemy
){

    if(

        !triggerEnemy ||

        !triggerEnemy.alive ||

        game.battle.active ||

        game.battleCooldown

    ){

        return;
    }


    game.battleCooldown =
        true;


    setTimeout(
        ()=>{
            game.battleCooldown =
                false;
        },
        700
    );


    game.battle.active =
        true;


    /*
       TEST RANDOMIZER:
       1–3 enemies.

       Trigger enemy is always included.
    */

    const battleEnemies=[
        triggerEnemy
    ];


    const count =
        1+
        Math.floor(
            Math.random()*3
        );


    const available =
        game.enemies.filter(
            enemy=>{

                return(

                    enemy.alive &&

                    enemy.id !==
                    triggerEnemy.id &&

                    distance(
                        enemy,
                        triggerEnemy
                    )<650

                );

            }
        );


    while(

        battleEnemies.length<count &&

        available.length>0

    ){

        const index =
            Math.floor(
                Math.random()*
                available.length
            );


        const enemy =
            available.splice(
                index,
                1
            )[0];


        battleEnemies.push(
            enemy
        );

    }


    game.battle.enemies =
        battleEnemies;


    game.battle.selected=0;

    game.battle.playerTurn=true;

    game.battle.defenseActive=false;

    game.battle.wayActive=
        game.hechie.wayTurns>0;


    document.getElementById(
        "battle"
    ).style.display =
        "block";


    document.getElementById(
        "battleEnd"
    ).style.display =
        "none";


    updateBattleUI();

}

/* =========================================================

========================================================= */

function getSelectedEnemy(){

    const enemy =
        game.battle.enemies[
            game.battle.selected
        ];


    if(

        enemy &&

        enemy.alive

    ){

        return enemy;
    }


    return game.battle.enemies.find(
        e=>e.alive
    );

}

/* =========================================================
   ENEMY DEFEATED
========================================================= */

function checkEnemyDefeated(
    enemy
){

    if(

        !enemy ||

        enemy.hp>0 ||

        !enemy.alive

    ){

        return;
    }


    enemy.alive =
        false;


    enemy.hp=0;


    gainEXP(
        enemy.xp
    );


    const element =
        document.querySelector(

            `.enemy[data-id="${enemy.id}"]`

        );


    if(element){

        element.remove();

    }


    if(
        game.battle.active
    ){

        battleMessage(

            `${enemyTypes[enemy.type].name} defeated! +${enemy.xp} EXP`

        );

    }


    updateBattleUI();


    /*
       IMPORTANT:
       We do NOT spawn a replacement enemy.
    */

    if(

        game.battle.enemies.length>0 &&

        game.battle.enemies.every(
            e=>!e.alive
        )

    ){

        victory();

    }

}


/* =========================================================
   ENEMY TURN
========================================================= */

function enemyTurn(){

    game.battle.playerTurn =
        false;


    setTimeout(
        ()=>{

            if(
                !game.battle.active
            ){

                return;
            }


            /*
               Poison damage.
            */

            game.battle.enemies.forEach(
                enemy=>{

                    if(

                        !enemy.alive ||

                        !enemy.poisoned

                    ){

                        return;
                    }


                    const poisonDamage =
                        Math.max(

                            1,

                            Math.round(

                                game.hechie.attack*
                                .2

                            )

                        );


                    enemy.hp -=
                        poisonDamage;


                    floatingDamage(
                        enemy.x,
                        enemy.y,
                        poisonDamage
                    );


                    if(
                        enemy.hp<=0
                    ){

                        enemy.hp=0;

                        checkEnemyDefeated(
                            enemy
                        );

                    }

                }
            );


            if(
                !game.battle.active
            ){

                return;
            }


            const living =
                game.battle.enemies.filter(
                    e=>e.alive
                );


            if(
                living.length===0
            ){

                victory();

                return;
            }


            /*
               Enemy attacks.
            */

            living.forEach(
                enemy=>{

                    if(
                        game.hechie.hp<=0
                    ){

                        return;
                    }


                    let damage =
                        calculateDamage(

                            enemy.attack,

                            1,

                            game.hechie.defense

                        );


                    /*
                       Shield absorbs damage first.
                    */

                    if(
                        game.hechie.shield>0
                    ){

                        const absorbed =
                            Math.min(

                                game.hechie.shield,

                                damage

                            );


                        game.hechie.shield -=
                            absorbed;


                        damage -=
                            absorbed;

                    }


                    /*
                       Ultimate Defense reflects
                       the remaining damage.
                    */

                    if(
                        game.battle.defenseActive
                    ){

                        const reflected =
                            damage;


                        enemy.hp -=
                            reflected;


                        floatingDamage(
                            enemy.x,
                            enemy.y,
                            reflected
                        );


                        battleMessage(

                            `Ultimate Defense reflected ${reflected} damage!`

                        );


                        checkEnemyDefeated(
                            enemy
                        );


                        damage=0;

                    }


                    if(
                        damage>0
                    ){

                        game.hechie.hp -=
                            damage;

                    }

                }
            );


            game.battle.defenseActive =
                false;


            updateHUD();


            if(
                game.hechie.hp<=0
            ){

                defeat();

                return;
            }


            /*
               Way Of The Bisento
               duration.
            */

            if(
                game.battle.wayActive
            ){

                game.hechie.wayTurns--;


                if(
                    game.hechie.wayTurns<=0
                ){

                    /*
                       Return the modified stats.
                    */

                    game.hechie.attack =
                        Math.max(

                            1,

                            game.hechie.attack/5

                        );


                    game.hechie.maxEnergy =
                        Math.max(

                            1,

                            game.hechie.maxEnergy/2

                        );


                    game.hechie.energy =
                        Math.min(

                            game.hechie.energy,

                            game.hechie.maxEnergy

                        );


                    game.battle.wayActive =
                        false;


                    battleMessage(

                        "Way Of The Bisento has ended."

                    );

                }

            }


            if(
                game.battle.active
            ){

                game.battle.playerTurn =
                    true;

                updateBattleUI();

            }

        },

        600

    );

}

        menu.style.display==="block"

        ?

        "none"

        :

        "block";

};


document.getElementById(
    "resumeButton"
).onclick = ()=>{

    document.getElementById(
        "menu"
    ).style.display =
        "none";

};


document.getElementById(
    "saveButton"
).onclick = ()=>{

    saveGame();


    document.getElementById(
        "menu"
    ).style.display =
        "none";

};


document.getElementById(
    "resetButton"
).onclick = ()=>{

    saveGame();


    game.running =
        false;


    document.getElementById(
        "game"
    ).style.display =
        "none";


    document.getElementById(
        "startScreen"
    ).style.display =
        "flex";


    document.getElementById(
        "menu"
    ).style.display =
        "none";

};


/* =========================================================
   NEW STORY
========================================================= */

function startNewStory(){

    game.running =
        true;


    game.player.x =
        550;

    game.player.y =
        700;


    game.hechie.level =
        1;


    game.hechie.hp =
        100;

    game.hechie.maxHp =
        100;


    game.hechie.energy =
        250;

    game.hechie.maxEnergy =
        400;


    game.hechie.attack =
        10;

    game.hechie.defense =
        8;


    game.hechie.exp =
        0;

    game.hechie.nextExp =
        100;


    game.hechie.shield =
        0;

    game.hechie.wayTurns =
        0;


    game.cameraX=0;
    game.cameraY=0;


    game.battle.active =
        false;


    game.battle.enemies=[];


    document.getElementById(
        "startScreen"
    ).style.display =
        "none";


    document.getElementById(
        "game"
    ).style.display =
        "block";


    createDecorations();


    /*
       New Story gets a brand-new world.
    */

    createNewEnemyWorld();


    updateHUD();

    updatePlayer();


    saveGame();

}


/* =========================================================
   CONTINUE STORY
========================================================= */

function continueStory(){

    if(
        !localStorage.getItem(
            SAVE_KEY
        )
    ){

        startNewStory();

        return;
    }


    const loaded =
        loadGame();


    if(!loaded){

        startNewStory();

        return;
    }


    game.running =
        true;


    document.getElementById(
        "startScreen"
    ).style.display =
        "none";


    document.getElementById(
        "game"
    ).style.display =
        "block";


    createDecorations();


    /*
       Render the saved enemies exactly
       where they were saved.
    */

    initialSpawn();


    updateHUD();

    updatePlayer();

}


/* =========================================================
   NEW STORY BUTTON
========================================================= */

document.getElementById(
    "newStoryButton"
).addEventListener(
    "click",
    ()=>{

        startNewStory();

    }
);


/* =========================================================
   CONTINUE BUTTON
========================================================= */

document.getElementById(
    "continueButton"
).addEventListener(
    "click",
    ()=>{

        continueStory();

    }
);


/* =========================================================
   SAVE STATUS
========================================================= */

if(
    localStorage.getItem(
        SAVE_KEY
    )
){

    document.getElementById(
        "saveStatus"
    ).textContent =
        "A saved story is available.";

}else{

    document.getElementById(
        "saveStatus"
    ).textContent =
        "No saved story yet.";

}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

let lastTime=0;


function gameLoop(
    timestamp
){

    const delta =
        timestamp-
        lastTime;


    lastTime =
        timestamp;


    if(

        game.running &&

        !game.battle.active

    ){

        updatePlayer();


        if(
            delta>0
        ){

            updateEnemyMovement();

        }

    }


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   KEYBOARD TEST CONTROLS
========================================================= */

const keys={};


window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ] =
            true;


        if(

            !game.running ||

            game.battle.active

        ){

            return;
        }


        let dx=0;
        let dy=0;


        if(
            keys["w"] ||
            keys["arrowup"]
        ){

            dy=-1;

        }


        if(
            keys["s"] ||
            keys["arrowdown"]
        ){

            dy=1;

        }


        if(
            keys["a"] ||
            keys["arrowleft"]
        ){

            dx=-1;

        }


        if(
            keys["d"] ||
            keys["arrowright"]
        ){

            dx=1;

        }


        const length =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(
            length>0
        ){

            game.player.x +=
                dx/length*
                game.player.speed;


            game.player.y +=
                dy/length*
                game.player.speed;

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ] =
            false;

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(
            game.running
        ){

            updatePlayer();

        }

    }
);


/* =========================================================
   TOUCH SAFETY
========================================================= */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            game.running
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);


/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(
    ()=>{

        if(

            game.running &&

            !game.battle.active

        ){

            saveGame();

        }

    },
    15000
);


/* =========================================================
   FINAL INITIALIZATION
========================================================= */

updateHUD();

</script>
